name: geofencing_service
description: >-
  Circular geofences for Flutter: enter, exit, and dwell (Android) with
  background callbacks, diagnostics, and improved iOS/Android reliability.
version: 1.3.4
topics:
  - geofencing
  - location
  - background
  - geolocation
homepage: https://matteotomasini.com
repository: https://github.com/mattetom/FlutterGeofencing
issue_tracker: https://github.com/mattetom/FlutterGeofencing/issues

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.geofencing
        pluginClass: GeofencingPlugin
      ios:
        pluginClass: GeofencingPlugin
